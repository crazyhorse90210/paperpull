; Running two suites in one command used to stop before any test ran.
;
;     pytest core/tests gui/tests
;     ERROR collecting test_scope.py
;     import file mismatch
;
; There is a test_scope.py in both, neither directory is a package, so
; pytest imported one and then refused the other because the module name
; was taken. A hard collection error, no tests run, and the answer is a
; paragraph about __pycache__ that sends you looking in the wrong place.
;
; tools/run_all_tests.py never hit it, because it runs each suite in its
; own pytest, which is also why CI stayed green. So the only person who
; met this was somebody running the tests the obvious way, which is the
; one person a test suite most needs to keep.
;
; importlib gives each file its own module identity, so two files may
; share a name. It is the import mode pytest recommends for new projects
; and will default to in pytest 9.
;
; That only moved the wall. The test files may share names now, but the
; apps' own modules still cannot. Every app has its own storage.py, and its
; tests put the app's folder on sys.path and import storage. One process
; keeps the first app's storage in sys.modules, so from the root the
; second app stopped with this.
;
;     pytest apps/amazon apps/apple
;     cannot import name 'APP_STORE' from 'storage' (apps\amazon\storage.py)
;
; Or, worse, an app ran its tests against another app's storage without a
; word. Emptying sys.modules between apps was tried on 2026-10-19 and is no
; cure, because the core binds one app per process. Amazon beside Apple
; then failed 8 of Amazon's tests that pass with Amazon alone.
;
; So the suite is the unit, one pytest each, the way the runner and CI
; already run them. conftest.py beside this file stops a command that
; reaches into more than one suite before anything is collected, and says
; what to run instead.
[pytest]
addopts = --import-mode=importlib
